<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TREND TOWER</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#0F1420; --panel:#161D2C; --panel-2:#1B2338; --line: rgba(255,255,255,0.08);
  --text:#E9E7DE; --text-dim:#8B93A8;
  --coral:#FF6B6B; --amber:#FFB84D; --teal:#5EEAD4; --lavender:#B4A7FF;
}
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Mono', monospace; min-height:100vh; padding:32px 20px 60px; }
.tower{ max-width:880px; margin:0 auto; }
.eyebrow{ font-size:11px; letter-spacing:0.2em; color:var(--text-dim); text-transform:uppercase; margin-bottom:6px; }
h1{ font-family:'Space Grotesk', sans-serif; font-size:28px; font-weight:700; margin:0 0 4px; letter-spacing:-0.01em; }
.sub{ color:var(--text-dim); font-size:13px; margin-bottom:28px; line-height:1.6; }
.console{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 24px; margin-bottom:28px; }
.lights{ display:flex; gap:22px; margin-bottom:20px; flex-wrap:wrap; }
.light{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-dim); }
.dot{ width:9px; height:9px; border-radius:50%; background:#2A3245; transition:all .25s ease; }
.dot.active{ box-shadow:0 0 10px 2px currentColor; }
.dot.scanning{ animation:pulse 0.9s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{opacity:.35;} 50%{opacity:1;} }
.prompt-row{ display:flex; align-items:center; gap:10px; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
.caret{ color:var(--amber); font-weight:600; }
input#cmd{ flex:1; background:transparent; border:none; outline:none; color:var(--text); font-family:'IBM Plex Mono', monospace; font-size:14px; caret-color:var(--amber); }
input#cmd::placeholder{ color:var(--text-dim); }
.status{ margin-top:12px; font-size:12px; color:var(--text-dim); }
.status.ok{ color:var(--teal); } .status.err{ color:var(--coral); }
.insight{ background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--amber); border-radius:8px; padding:14px 16px; font-size:13px; color:var(--text); margin-bottom:20px; display:none; }
.insight.show{ display:block; }
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:32px; }
@media (max-width:640px){ .grid{ grid-template-columns:1fr; } }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; opacity:0; transform:translateY(6px); animation:rise .4s ease forwards; }
@keyframes rise{ to{opacity:1; transform:translateY(0);} }
.card-head{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.chip{ font-family:'Space Grotesk', sans-serif; font-size:11px; font-weight:700; padding:3px 8px; border-radius:5px; color:#0F1420; }
.card-head .platform{ font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px; }
.card-head .focus{ font-size:11px; color:var(--text-dim); margin-left:auto; }
.item{ padding:9px 0; border-top:1px solid var(--line); }
.item:first-of-type{ border-top:none; }
.item-title{ font-weight:600; font-size:13px; margin-bottom:3px; }
.item-summary{ font-size:12px; color:var(--text-dim); line-height:1.5; }
.item a{ font-size:11px; color:var(--teal); text-decoration:none; word-break:break-all; }
.item a:hover{ text-decoration:underline; }
.history{ border-top:1px solid var(--line); padding-top:18px; }
.history h3{ font-family:'Space Grotesk', sans-serif; font-size:13px; color:var(--text-dim); font-weight:600; margin:0 0 10px; text-transform:uppercase; letter-spacing:0.08em; }
#historyList{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:6px; }
#historyList li{ font-size:12px; color:var(--text-dim); cursor:pointer; padding:8px 10px; border-radius:6px; border:1px solid transparent; }
#historyList li:hover{ background:var(--panel); border-color:var(--line); color:var(--text); }
#historyList .empty{ cursor:default; }
#historyList .empty:hover{ background:none; border-color:transparent; color:var(--text-dim); }
.footnote{ margin-top:20px; font-size:11px; color:var(--text-dim); text-align:center; }
</style>
</head>
<body>
<div class="tower">
  <div class="eyebrow">LUIBUILDER · CONTROL ROOM</div>
  <h1>TREND TOWER</h1>
  <div class="sub">매일 오전 8시(KST) 자동 갱신 · X · 인스타그램 · 스레드 · 홈쇼핑 4개 채널 스캔. "고"를 입력하면 최신 데이터를 다시 불러옵니다.</div>

  <div class="console">
    <div class="lights">
      <div class="light"><div class="dot" id="dot-x" style="color:var(--coral)"></div>X</div>
      <div class="light"><div class="dot" id="dot-ig" style="color:var(--amber)"></div>IG</div>
      <div class="light"><div class="dot" id="dot-th" style="color:var(--teal)"></div>TH</div>
      <div class="light"><div class="dot" id="dot-hs" style="color:var(--lavender)"></div>HS</div>
    </div>
    <div class="prompt-row">
      <span class="caret">&gt;</span>
      <input id="cmd" type="text" placeholder="명령어 입력 후 Enter  (힌트: 고)" autocomplete="off" />
    </div>
    <div class="status" id="status">불러오는 중...</div>
  </div>

  <div class="insight" id="insight"></div>
  <div class="grid" id="report"></div>

  <div class="history">
    <h3>지난 리포트</h3>
    <ul id="historyList"><li class="empty">불러오는 중...</li></ul>
  </div>

  <div class="footnote">데이터는 GitHub Actions가 매일 자동 수집합니다. 즉시 갱신하려면 Actions 탭에서 "Run workflow"를 실행하세요.</div>
</div>

<script>
const dotOrder = ["X(트위터)","인스타그램","스레드","홈쇼핑"];
const dots = {
  "X(트위터)": document.getElementById('dot-x'),
  "인스타그램": document.getElementById('dot-ig'),
  "스레드": document.getElementById('dot-th'),
  "홈쇼핑": document.getElementById('dot-hs')
};

function styleFor(platform){
  if(platform.includes('X') || platform.includes('트위터')) return {color:"var(--coral)", abbr:"X"};
  if(platform.includes('인스타')) return {color:"var(--amber)", abbr:"IG"};
  if(platform.includes('스레드')) return {color:"var(--teal)", abbr:"TH"};
  return {color:"var(--lavender)", abbr:"HS"};
}

function setStatus(text, cls){
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status' + (cls ? ' '+cls : '');
}

function lightUp(){ dotOrder.forEach(k => dots[k].classList.add('active')); }
function startScan(){ dotOrder.forEach(k => dots[k].classList.add('scanning')); }
function stopScan(){ dotOrder.forEach(k => dots[k].classList.remove('scanning')); }

function renderReport(report){
  const grid = document.getElementById('report');
  grid.innerHTML = '';
  const insightEl = document.getElementById('insight');
  if(report.insight){
    insightEl.textContent = "💡 " + report.insight;
    insightEl.classList.add('show');
  }
  (report.channels || []).forEach((ch, i) => {
    const st = styleFor(ch.platform);
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (i * 0.08) + 's';
    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = `<span class="chip" style="background:${st.color}">${st.abbr}</span>
      <span class="platform">${ch.platform}</span>
      <span class="focus">${ch.focus || ''}</span>`;
    card.appendChild(head);
    (ch.items || []).forEach(item => {
      const row = document.createElement('div');
      row.className = 'item';
      row.innerHTML = `<div class="item-title">${item.title || ''}</div>
        <div class="item-summary">${item.summary || ''}</div>
        ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener">${item.link}</a>` : ''}`;
      card.appendChild(row);
    });
    grid.appendChild(card);
  });
  lightUp();
}

async function fetchJSON(path){
  const res = await fetch(path + '?t=' + Date.now()); // 캐시 무력화
  if(!res.ok) throw new Error(path + ' 로드 실패');
  return res.json();
}

async function loadLatest(){
  setStatus('불러오는 중...');
  startScan();
  try{
    const report = await fetchJSON('./data/latest.json');
    stopScan();
    renderReport(report);
    setStatus((report.date || '') + ' 리포트 · 자동 수집됨', 'ok');
  }catch(e){
    stopScan();
    setStatus('아직 수집된 데이터가 없습니다. Actions 탭에서 첫 실행을 해주세요.', 'err');
  }
}

async function loadHistory(){
  const list = document.getElementById('historyList');
  try{
    const index = await fetchJSON('./data/index.json');
    if(!index || index.length === 0){
      list.innerHTML = '<li class="empty">아직 저장된 리포트가 없습니다.</li>';
      return;
    }
    list.innerHTML = '';
    index.slice(0, 14).forEach(dateStr => {
      const li = document.createElement('li');
      li.textContent = dateStr;
      li.onclick = async () => {
        try{
          const report = await fetchJSON(`./data/history/${dateStr}.json`);
          renderReport(report);
          setStatus(dateStr + ' 리포트 불러옴', 'ok');
        }catch(e){ setStatus('불러오기 실패', 'err'); }
      };
      list.appendChild(li);
    });
  }catch(e){
    list.innerHTML = '<li class="empty">히스토리를 불러올 수 없습니다.</li>';
  }
}

document.getElementById('cmd').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    const val = e.target.value.trim();
    e.target.value = '';
    if(val === '고' || val.toLowerCase() === 'go'){
      loadLatest();
    }else{
      setStatus('알 수 없는 명령어입니다. "고" 를 입력해보세요.', 'err');
    }
  }
});

loadLatest();
loadHistory();
</script>
</body>
</html>
