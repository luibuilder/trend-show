name: Daily Trend Scan

on:
  schedule:
    - cron: '0 23 * * *'   # UTC 23:00 = KST 08:00 (매일 아침)
  workflow_dispatch: {}     # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 트렌드 검색 실행
        run: node scripts/fetch-trends.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name "trend-tower-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git commit -m "Daily trend update $(date -u +'%Y-%m-%d')" || echo "변경사항 없음"
          git push
